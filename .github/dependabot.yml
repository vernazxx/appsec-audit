version: 2

updates:
  # Bumps SHA-pinned actions, keeping the `# vX.Y.Z` comments
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      timezone: 'Europe/Lisbon'
      day: monday
      time: '09:00'
    rebase-strategy: auto
    # Wait before proposing freshly published versions (supply-chain hardening)
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-deps:
        patterns:
          - "*"
